<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Jubb!</title>

<style>
body{
    font-family:Arial;
    text-align:center;
    margin-top:40px;
}

table{
    margin:auto;
    border-collapse:collapse;
}

td,th{
    border:1px solid #ccc;
    padding:10px 20px;
}
</style>

</head>
<body>

<h1>Jubb</h1>

<table id="table">
<tr>
<th>Uppgift</th>
<th>TFL</th>
</tr>
</table>

<script>

// Users and tasks
const users = ["Jonatan","Jonas","Michaela"];
const tasks = ["Change","Incident","Övrigt"];

// get hour number since epoch
function getHourNumber(){
    return Math.floor(Date.now() / (1000 * 60 * 60));
}

// deterministic assignments based on hour
function generateAssignments(){
    const hour = getHourNumber();
    let assignments = {};

    for(let i=0; i<tasks.length; i++){
        const userIndex = (i + hour) % users.length;
        assignments[tasks[i]] = users[userIndex];
    }

    return assignments;
}

// render table
function render(){
    const assignments = generateAssignments();
    const table = document.getElementById("table");

    // clear old rows
    table.querySelectorAll("tr:not(:first-child)").forEach(tr => tr.remove());

    for(const task in assignments){
        const row = document.createElement("tr");
        row.innerHTML = `
        <td>${task}</td>
        <td>${assignments[task]}</td>
        `;
        table.appendChild(row);
    }
}

// initial render
render();

// optional: auto-refresh every hour on the hour
setInterval(() => {
    render();
}, 1000 * 60 * 60);

</script>

</body>
</html>
