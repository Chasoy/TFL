<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Jubb!</title>
<style>
body{
    font-family: Arial;
    text-align: center;
    margin-top: 40px;
}
table{
    margin: auto;
    border-collapse: collapse;
}
td{
    width: 200px;
    height: 50px;
    border: 1px solid #ccc;
    font-weight: bold;
    color: #fff;
    text-align: center;
    vertical-align: middle;
    font-size: 18px;
}
.green{ background-color: #04ac2b; }
.blue{ background-color: #0066cc; }
.red{ background-color: #ff2537; }
</style>
</head>
<body>

<h1>Jubb</h1>

<table id="table"></table>

<script>
// Users
const users = ["Jonatan", "Jonas", "Michaela"];
// Colors
const colors = ["green", "red", "blue"];

// deterministic pseudo-random function based on minute
function seededRandom(seed){
    let x = Math.sin(seed) * 10000;
    return x - Math.floor(x);
}

// get minute number since epoch
function getMinuteNumber(){
    return Math.floor(Date.now() / (1000*60));
}

// shuffle colors deterministically
function shuffleColors(seed){
    let arr = [...colors];
    for(let i=arr.length-1; i>0; i--){
        seed++;
        const j = Math.floor(seededRandom(seed)*(i+1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

// render table
function render(){
    const table = document.getElementById("table");
    table.innerHTML="";

    // use current minute as seed
    const seed = getMinuteNumber();
    const assignment = shuffleColors(seed);

    for(let i=0;i<users.length;i++){
        const row = document.createElement("tr");
        const cell = document.createElement("td");
        cell.textContent = users[i];
        cell.className = assignment[i];
        row.appendChild(cell);
        table.appendChild(row);
    }
}

// initial render
render();
// refresh every minute
setInterval(render, 1000*60);

</script>

</body>
</html>
